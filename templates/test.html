{% extends "base.html" %}
{% block title %}Test Mode – MindMath{% endblock %}
{% block body %}
<div class="screen test-screen">

  <!-- Top bar: global timer + score + progress -->
  <div class="top-bar test-top-bar">
    <button class="quit-btn" id="quit-btn">&#x2715; Quit</button>
    <div class="test-progress">
      <span id="q-counter">Q 1 / {{ total_questions }}</span>
    </div>
    <div id="global-timer" class="timer test-timer">8:00</div>
    <div class="score-display">
      <span id="score-val">0</span>
      <span class="score-label"> pts</span>
    </div>
    <button id="pause-btn" class="btn-pause">⏸</button>
    <button id="flag-btn" class="btn-pause">🚩</button>
  </div>

  <!-- Quit confirmation (inline, shown above progress bar) -->
  <div class="quit-confirm" id="quit-confirm" style="display:none">
    <p>Are you sure? Your progress will be lost.</p>
    <div class="quit-confirm-btns">
      <button class="btn-secondary" onclick="hideQuitConfirm()">Cancel</button>
      <button class="btn-quit-confirm" onclick="confirmQuit()">Yes, quit</button>
    </div>
  </div>

  <!-- Progress bar (question index) -->
  <div class="progress-bar-wrap">
    <div id="progress-bar" class="progress-bar" style="width:0%"></div>
  </div>

  <!-- Middle zone: question card -->
  <div class="middle-zone">
    <div class="question-card" id="question-card">
      <div class="question-category" id="q-category"></div>
      <div class="question-text" id="q-text"></div>
    </div>
  </div>

  <!-- Bottom zone: MC options + skip -->
  <div class="bottom-zone">
    <div class="options-grid" id="options-grid"></div>
    <button class="btn-skip" id="skip-btn" ontouchstart="skipTap(event)" onclick="chooseAnswer(null)">Skip</button>
  </div>


</div>

<!-- Pause overlay -->
<div class="pause-overlay" id="pause-overlay" style="display:none">
  <div class="pause-header">
    <span class="pause-title" id="pause-title">⏸ Paused — Question Log (0 answered)</span>
  </div>
  <div class="pause-log" id="pause-log"></div>
  <button class="pause-resume-btn" ontouchend="_tap(event, resumeGame)" onclick="_tap(event, resumeGame)">▶ Resume</button>
</div>

<!-- Flag modal -->
<div class="modal-backdrop" id="modal-backdrop" style="display:none" ontouchend="_tap(event, closeFlag)" onclick="_tap(event, closeFlag)"></div>
<div class="modal" id="flag-modal" style="display:none">
  <h3>Flag this question</h3>
  <div class="modal-question" id="modal-q-text"></div>
  <div class="modal-answer">Answer: <strong id="modal-q-answer"></strong></div>
  <textarea id="flag-comment" class="flag-comment" placeholder="Optional comment…" rows="3"></textarea>
  <div class="modal-btns">
    <button class="btn-secondary" ontouchend="_tap(event, closeFlag)" onclick="_tap(event, closeFlag)">Cancel</button>
    <button class="btn-primary" ontouchend="_tap(event, submitFlag)" onclick="_tap(event, submitFlag)">Submit Flag</button>
  </div>
</div>

<script src="/static/js/rng.js"></script>
<script src="/static/js/question_engine.js"></script>
<script>
const QUESTIONS = {{ questions_json | safe }};
const TOTAL = {{ total_questions }};
const TEST_DURATION = {{ test_duration }};
const SERVER_START = {{ start_time }};
const DIFFICULTY = "{{ difficulty }}";

let currentIndex = 0;
let score = 0;
let chosenAnswers = new Array(TOTAL).fill(null);  // null = skipped
let timerInterval = null;
let testEnded = false;
let isPaused = false;
let frozenElapsed = 0;        // elapsed at pause moment
let pauseElapsedOffset = 0;   // total seconds spent paused (added to elapsed)
let pauseStartWallTime = 0;   // wall-clock time when pause began
let sessionLog = [];          // answered questions log
let flagLogIndex = null;      // null = current question, >= 0 = sessionLog index

// ── OFFLINE STATE ─────────────────────────────────────────────────────────────
let _offlineActive = false;
let _offlineRng    = new RNG();
let _offlineStats  = { correct: 0, wrong: 0, skipped: 0, score: 0 };

function _goOffline() {
  if (_offlineActive) return;
  _offlineActive = true;
  showOfflineToast();
}

function _updateOfflineStats(result) {
  _offlineStats[result]++;
}

// Test Mode pre-loads all questions and makes no per-question fetch, so
// there is nothing here to fail on a dead connection until /end-test — the
// offline event below is the primary detection mechanism, not a supplement.
window.addEventListener('offline', function() { _goOffline(); });
window.addEventListener('online', function() {
  _offlineActive = false;
  var t = document.getElementById('offline-toast');
  if (t) t.remove();
});

// Defense-in-depth for "interface up, server unreachable" (weak signal,
// captive portal, server down) during an active test — the offline event
// above won't catch this since the network interface itself stays up.
// A lightweight periodic ping detects it. The query string is cache-busting:
// it makes the request URL miss the service worker's precache (mindmath-v3
// includes /static/manifest.json with no query string), forcing a real
// network round-trip rather than an instant cache-first resolution.
let _connCheckInterval = setInterval(function() {
  if (testEnded || _offlineActive) { clearInterval(_connCheckInterval); return; }
  fetch('/static/manifest.json?_conncheck=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
    .catch(function() { _goOffline(); });
}, 25000);

function getElapsed() {
  if (isPaused) return frozenElapsed;
  // pauseElapsedOffset: accumulated paused seconds
  return (Date.now() / 1000) - SERVER_START - pauseElapsedOffset;
}

function getRemaining() {
  return Math.max(0, TEST_DURATION - getElapsed());
}

function formatTime(secs) {
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function updateTimer() {
  const rem = getRemaining();
  const el = document.getElementById('global-timer');
  el.textContent = formatTime(rem);
  if (rem <= 60) {
    el.classList.add('urgent');
  } else {
    el.classList.remove('urgent');
  }
  if (rem <= 0 && !testEnded) {
    endTest();
  }
}

function renderQuestion(idx) {
  if (idx >= TOTAL) { endTest(); return; }
  const q = QUESTIONS[idx];

  document.getElementById('q-counter').textContent = 'Q ' + (idx + 1) + ' / ' + TOTAL;
  document.getElementById('q-category').textContent =
    (q.category || '').charAt(0).toUpperCase() + (q.category || '').slice(1);
  document.getElementById('q-text').textContent = q.text;
  document.getElementById('score-val').textContent = score;

  // Progress bar
  const pct = (idx / TOTAL * 100).toFixed(1);
  document.getElementById('progress-bar').style.width = pct + '%';

  // Options
  const grid = document.getElementById('options-grid');
  grid.innerHTML = '';
  (q.options || []).forEach(function(opt, i) {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt;
    btn.addEventListener('touchstart', function(e) { e.preventDefault(); chooseAnswer(i); });
    btn.onclick = function() { chooseAnswer(i); };
    grid.appendChild(btn);
  });
}

function chooseAnswer(optionIndex) {
  if (testEnded || isPaused) return;

  const q = QUESTIONS[currentIndex];
  chosenAnswers[currentIndex] = optionIndex;  // null = skip

  let result = 'skipped';
  if (optionIndex !== null) {
    if (optionIndex === q.correct_index) {
      score += 1;
      result = 'correct';
    } else {
      score -= 1;
      result = 'wrong';
    }
    document.getElementById('score-val').textContent = score;
  }

  // Track offline stats (used if endTest fetch fails)
  _updateOfflineStats(result);
  if (result === 'correct') _offlineStats.score++;
  else if (result === 'wrong') _offlineStats.score--;

  // Record in session log
  sessionLog.push({
    number: sessionLog.length + 1,
    question_text: q.text || '',
    user_answer: optionIndex !== null ? (q.options[optionIndex] || '—') : '—',
    correct_answer: q.options ? q.options[q.correct_index] : '',
    result: result,
    category: q.category || '',
  });

  currentIndex++;
  if (currentIndex >= TOTAL) {
    endTest();
  } else {
    renderQuestion(currentIndex);
  }
}

function endTest() {
  if (testEnded) return;
  testEnded = true;
  clearInterval(timerInterval);

  // Disable UI
  document.getElementById('options-grid').innerHTML = '<p class="ending-msg">Submitting…</p>';
  document.getElementById('skip-btn').disabled = true;

  if (_offlineActive) {
    var hasPending = (localStorage.getItem('pending_flags')||'[]') !== '[]';
    showOfflineResults({ correct: _offlineStats.correct, wrong: _offlineStats.wrong, skipped: _offlineStats.skipped, score: _offlineStats.score, pendingFlags: hasPending }, function() { window.location.reload(); });
    return;
  }

  fetch('/end-test', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      answers: chosenAnswers,
      elapsed: getElapsed()
    })
  })
  .then(r => r.json())
  .then(data => { window.location.href = data.redirect; })
  .catch(function() {
    _goOffline();
    var hasPending = (localStorage.getItem('pending_flags')||'[]') !== '[]';
    showOfflineResults({ correct: _offlineStats.correct, wrong: _offlineStats.wrong, skipped: _offlineStats.skipped, score: _offlineStats.score, pendingFlags: hasPending }, function() { window.location.reload(); });
  });
}

// ── PAUSE ────────────────────────────────────────────────────────────────────

function togglePause() {
  if (isPaused) {
    resumeGame();
  } else {
    pauseGame();
  }
}

function pauseGame() {
  if (testEnded) return;
  frozenElapsed = getElapsed();  // capture before setting isPaused
  isPaused = true;
  pauseStartWallTime = Date.now() / 1000;
  clearInterval(timerInterval);

  const btn = document.getElementById('pause-btn');
  if (btn) btn.textContent = '▶';

  renderPauseLog();
  document.getElementById('pause-overlay').style.display = 'flex';
}

function resumeGame() {
  isPaused = false;
  // Accumulate paused seconds so getElapsed() continues from where it left off
  pauseElapsedOffset += (Date.now() / 1000 - pauseStartWallTime);

  const btn = document.getElementById('pause-btn');
  if (btn) btn.textContent = '⏸';

  document.getElementById('pause-overlay').style.display = 'none';

  timerInterval = setInterval(updateTimer, 250);
  updateTimer();
}

function renderPauseLog() {
  const titleEl = document.getElementById('pause-title');
  const container = document.getElementById('pause-log');
  if (!container) return;
  if (titleEl) titleEl.textContent = '⏸ Paused — Question Log (' + sessionLog.length + ' answered)';
  if (!sessionLog.length) {
    container.innerHTML = '<div class="pause-empty">No questions answered yet.</div>';
    return;
  }
  // Show most recent first
  const entries = sessionLog.slice().reverse();
  container.innerHTML = entries.map(function(q, i) {
    const origIndex = sessionLog.length - 1 - i;
    const icon = q.result === 'correct' ? '✓' : (q.result === 'wrong' ? '✗' : '—');
    const cls  = q.result === 'correct' ? 'correct' : (q.result === 'wrong' ? 'wrong' : 'skipped');
    const userAns = q.user_answer || '—';
    const flaggedAttr = q._flagged ? ' disabled' : '';
    const flagLabel = q._flagged ? '✓ Flagged' : '🚩';
    return '<div class="pause-log-entry ' + cls + '">'
      + '<div class="pause-log-top">'
      + '<span class="pause-log-meta">#' + q.number + ' &nbsp;' + icon + '</span>'
      + '<span class="pause-log-q">' + q.question_text + '</span>'
      + '<button class="pause-log-flag" id="plf-' + origIndex + '"' + flaggedAttr + ' ontouchend="_tap(event,function(){flagFromPauseLog(' + origIndex + ');})" onclick="_tap(event,function(){flagFromPauseLog(' + origIndex + ');})">' + flagLabel + '</button>'
      + '</div>'
      + '<div class="pause-log-answers">Your: ' + userAns + ' &nbsp;·&nbsp; Correct: ' + q.correct_answer + '</div>'
      + '</div>';
  }).join('');
}

function flagFromPauseLog(i) {
  const q = sessionLog[i];
  if (!q) return;
  flagLogIndex = i;
  document.getElementById('modal-q-text').textContent = q.question_text;
  document.getElementById('modal-q-answer').textContent = q.correct_answer;
  document.getElementById('flag-comment').value = '';
  document.getElementById('modal-backdrop').style.display = 'block';
  document.getElementById('flag-modal').style.display = 'block';
}

// ── FLAG MODAL ────────────────────────────────────────────────────────────────

function _tap(e, fn) {
  if (e.type === 'touchend') {
    e.preventDefault();
    e.currentTarget._lt = Date.now();
    fn();
  } else if (e.type === 'click') {
    if (e.currentTarget._lt && Date.now() - e.currentTarget._lt < 600) return;
    fn();
  }
}

function openFlag() {
  if (!isPaused) pauseGame();
  flagLogIndex = null;
  if (currentIndex >= TOTAL) return;
  const q = QUESTIONS[currentIndex];
  document.getElementById('modal-q-text').textContent = q.text || '';
  document.getElementById('modal-q-answer').textContent =
    (q.options && q.correct_index !== undefined) ? q.options[q.correct_index] : '';
  document.getElementById('flag-comment').value = '';
  document.getElementById('modal-backdrop').style.display = 'block';
  document.getElementById('flag-modal').style.display = 'block';
}

function closeFlag() {
  flagLogIndex = null;
  document.getElementById('modal-backdrop').style.display = 'none';
  document.getElementById('flag-modal').style.display = 'none';
}

function submitFlag() {
  let q_text, q_answer, q_category;

  if (flagLogIndex !== null && flagLogIndex >= 0) {
    const hq = sessionLog[flagLogIndex];
    if (!hq) { closeFlag(); return; }
    q_text     = hq.question_text;
    q_answer   = hq.correct_answer;
    q_category = hq.category;
    hq._flagged = true;
    const btn = document.getElementById('plf-' + flagLogIndex);
    if (btn) { btn.textContent = '✓ Flagged'; btn.disabled = true; }
  } else {
    if (currentIndex >= TOTAL) { closeFlag(); return; }
    const q = QUESTIONS[currentIndex];
    q_text     = q.text;
    q_answer   = q.options ? q.options[q.correct_index] : '';
    q_category = q.category;
  }

  const comment = document.getElementById('flag-comment').value;
  const flagPayload = {
    game_mode: 'test',
    difficulty: DIFFICULTY,
    question_text: q_text,
    correct_answer: q_answer,
    category: q_category,
    user_comment: comment
  };
  fetch('/flag', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(flagPayload)
  }).then(() => closeFlag()).catch(() => {
    queuePendingFlag(flagPayload);
    closeFlag();
    showFlagQueuedToast();
  });
}

// Skip touchstart helper (fires at finger-down; preventDefault suppresses click)
function skipTap(e) {
  if (e && e.type === 'touchstart') e.preventDefault();
  chooseAnswer(null);
}

// Quit
function showQuitConfirm() {
  document.getElementById('quit-confirm').style.display = 'block';
  document.getElementById('quit-btn').disabled = true;
}
function hideQuitConfirm() {
  document.getElementById('quit-confirm').style.display = 'none';
  document.getElementById('quit-btn').disabled = false;
}
function confirmQuit() {
  window.location.href = '/quit';
}

// Boot
timerInterval = setInterval(updateTimer, 250);
updateTimer();
renderQuestion(0);

// ── TOUCHEND BINDINGS (top bar) ───────────────────────────────────────────────
// touchend fires at finger-lift with no browser disambiguation delay.
// e.preventDefault() suppresses the synthesized click iOS fires after touchend.
// Timestamp guard (600ms) prevents double-fire on non-touch / edge cases.
(function() {
  function bindBtn(id, fn) {
    var el = document.getElementById(id);
    if (!el) return;
    var lastTouch = 0;
    el.addEventListener('touchend', function(e) {
      e.preventDefault();
      lastTouch = Date.now();
      fn();
    }, { passive: false });
    el.addEventListener('click', function() {
      if (Date.now() - lastTouch < 600) return;
      fn();
    });
  }
  bindBtn('quit-btn', showQuitConfirm);
  bindBtn('pause-btn', togglePause);
  bindBtn('flag-btn', openFlag);
})();
</script>
{% endblock %}
