{% extends "base.html" %}
{% block title %}MindMath Trainer{% endblock %}
{% block body %}
<div class="screen home-screen">
  <header class="home-header">
    <div class="logo">⚡</div>
    <h1>MindMath</h1>
    <p class="subtitle">Choose a game to play</p>
  </header>

  <div class="game-tiles">
    <a class="game-tile" href="/arithmetic">
      <div class="game-tile-icon" style="font-size:2.2rem;font-weight:900;color:var(--accent);">&#x3A3;</div>
      <div class="game-tile-body">
        <strong>Mental Arithmetic</strong>
        <span>Practice &amp; Test Mode</span>
      </div>
    </a>
    <a class="game-tile" href="/sequences">
      <div class="game-tile-icon">
        <svg viewBox="0 0 40 24" width="40" height="24" aria-hidden="true">
          <path d="M0,12 C5,0 10,0 15,12 C20,24 25,24 30,12 C35,0 40,0 40,12"
                fill="none" stroke="#6c63ff" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="game-tile-body">
        <strong>Sequences</strong>
        <span>Number &amp; Letter Patterns</span>
      </div>
    </a>
    <a class="game-tile" href="/associations">
      <div class="game-tile-icon">
        <svg viewBox="0 0 44 24" width="44" height="24" aria-hidden="true">
          <defs>
            <marker id="arrow-sm" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
              <path d="M0,0 L0,6 L6,3 z" fill="#6c63ff"/>
            </marker>
          </defs>
          <text x="1" y="19" font-size="18" fill="#6c63ff" font-family="serif" font-weight="bold">"</text>
          <line x1="14" y1="12" x2="28" y2="12" stroke="#6c63ff" stroke-width="1.8" marker-end="url(#arrow-sm)"/>
          <text x="31" y="19" font-size="18" fill="#6c63ff" font-family="serif" font-weight="bold">"</text>
        </svg>
      </div>
      <div class="game-tile-body">
        <strong>Word Associations</strong>
        <span>Verbal Analogies · EN / DE</span>
      </div>
    </a>
  </div>

  <footer class="home-footer">
    <a href="/flags" class="link-dim">Review flagged questions →</a>
  </footer>
</div>

<script>
// Game tile links: navigate on touchend to eliminate 300ms anchor tap delay
document.querySelectorAll('.game-tile').forEach(function(tile) {
  tile.addEventListener('touchend', function(e) {
    e.preventDefault();
    window.location.href = this.href;
  }, { passive: false });
});
</script>
{% endblock %}
