{% extends "base.html" %}
{% block title %}Sequences – MindMath{% endblock %}
{% block body %}
<div class="screen home-screen">
  <a href="/" class="back-link submenu-back">← Back</a>
  <header class="home-header">
    <h1>Sequences</h1>
    <p class="subtitle">Number &amp; Letter Patterns</p>
  </header>

  <form method="POST" action="/sequences/start" id="seqForm">

    <!-- Mode selection (card style, matching arithmetic.html) -->
    <section class="card">
      <h2>Mode</h2>
      <div class="btn-group" role="group">
        <label class="mode-btn selected" id="label-seq-practice">
          <input type="radio" name="mode" value="practice" checked>
          <span>
            <strong>Practice</strong>
            <small>Continuous · Open-ended</small>
          </span>
        </label>
        <label class="mode-btn" id="label-seq-test">
          <input type="radio" name="mode" value="test">
          <span>
            <strong>Test Mode</strong>
            <small>8 minutes · Multiple choice · +1 / −1</small>
          </span>
        </label>
      </div>
    </section>

    <!-- Difficulty selection (2×2 grid) -->
    <section class="card">
      <h2>Difficulty</h2>
      <div class="diff-grid" role="group">
        <label class="diff-btn">
          <input type="radio" name="difficulty" value="easy">
          <span>
            <strong>Easy</strong>
            <small>+1/+2, ×2, ABC</small>
          </span>
        </label>
        <label class="diff-btn">
          <input type="radio" name="difficulty" value="medium">
          <span>
            <strong>Medium</strong>
            <small>Geometric, squares</small>
          </span>
        </label>
        <label class="diff-btn">
          <input type="radio" name="difficulty" value="normal" checked>
          <span>
            <strong>Normal</strong>
            <small>Fibonacci, mixed</small>
          </span>
        </label>
        <label class="diff-btn">
          <input type="radio" name="difficulty" value="hard">
          <span>
            <strong>Hard</strong>
            <small>2nd-order, complex</small>
          </span>
        </label>
      </div>
    </section>

    <!-- Answer format (hidden in test mode) -->
    <section class="card settings-card" id="seq-settings-section">
      <h2>Settings</h2>
      <div class="setting-row">
        <span class="setting-label">Answer format</span>
        <div class="seg-group" role="group">
          <label class="seg-btn selected">
            <input type="radio" name="answer_mode" value="mc" checked>Multiple Choice
          </label>
          <label class="seg-btn">
            <input type="radio" name="answer_mode" value="open">Open Answer
          </label>
        </div>
      </div>
    </section>

    <button type="button" class="btn-primary btn-start" id="start-btn">Start</button>
  </form>

  <footer class="home-footer">
    <a href="/flags" class="link-dim">Review flagged questions →</a>
  </footer>
</div>

<script>
  // Highlight selected radio button groups + handle mode→settings toggle
  document.querySelectorAll('input[type="radio"]').forEach(function(radio) {
    radio.addEventListener('change', function() {
      var name = this.getAttribute('name');
      document.querySelectorAll('input[name="' + name + '"]').forEach(function(r) {
        r.closest('label').classList.remove('selected');
      });
      this.closest('label').classList.add('selected');
      if (name === 'mode') {
        _updateSeqSettingsForMode(this.value);
      }
    });
    if (radio.checked) radio.closest('label').classList.add('selected');
  });

  function _updateSeqSettingsForMode(mode) {
    var isTest = mode === 'test';
    var settingsSection = document.getElementById('seq-settings-section');
    var amInputs = document.querySelectorAll('input[name="answer_mode"]');
    if (settingsSection) {
      if (isTest) {
        settingsSection.classList.add('disabled-row');
        amInputs.forEach(function(i) { i.disabled = true; });
      } else {
        settingsSection.classList.remove('disabled-row');
        amInputs.forEach(function(i) { i.disabled = false; });
      }
    }
  }

  // Start button: touchend at finger-lift, timestamp guard prevents double-fire
  (function() {
    var btn = document.getElementById('start-btn');
    var lastTouch = 0;
    function doStart() {
      if (!navigator.onLine) {
        var diff = document.querySelector('input[name="difficulty"]:checked');
        var params = new URLSearchParams({ game: 'seq', difficulty: diff ? diff.value : 'normal' });
        sessionStorage.setItem('offline_start', params.toString());
        window.location.href = '/static/offline.html';
        return;
      }
      document.getElementById('seqForm').submit();
    }
    btn.addEventListener('touchend', function(e) { e.preventDefault(); lastTouch = Date.now(); doStart(); }, { passive: false });
    btn.addEventListener('click', function() { if (Date.now() - lastTouch < 600) return; doStart(); });
  })();
</script>
{% endblock %}
